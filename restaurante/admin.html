<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel Admin · Trattoria Liedlke</title>
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>

  <div class="admin-login" id="loginScreen">
    <div class="login-card">
      <div class="login-logo">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 2v7a2 2 0 0 0 2 2h0a2 2 0 0 0 2-2V2"/><path d="M9 11v11"/><path d="M17 2c-1.5 0-3 1.5-3 4v3.5c0 1 .5 1.5 1.5 1.5H17"/><path d="M17 2v20"/></svg>
      </div>
      <h1>Acesso do funcionário</h1>
      <form id="loginForm">
        <div class="a-field">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" placeholder="nome@saboremmesa.com" required />
        </div>
        <div class="a-field">
          <label for="loginPassword">Senha</label>
          <div class="password-wrap">
            <input type="password" id="loginPassword" placeholder="••••••••" required />
            <button type="button" class="toggle-pw" id="togglePw">Mostrar</button>
          </div>
        </div>
        <button type="submit" class="a-btn">Entrar</button>
      </form>
      <button class="a-link" id="forgotPw">Esqueci minha senha</button>
      <a href="index.html" class="back-to-site">‹ Voltar ao site</a>
    </div>
  </div>

  <div class="admin-shell" id="adminShell">
    <aside class="sidebar">
      <div class="sidebar-top">
        <span>SABOR EM MESA</span>
        <button class="sidebar-close" id="sidebarClose" title="Sair">✕</button>
      </div>
      <div class="gestor">
        <div class="gestor-avatar"></div>
        <div class="gestor-name"></div>
        <div class="gestor-underline"></div>
      </div>
      <nav class="side-nav">
        <button data-section="mesas" class="active">Pedidos e mesas</button>
        <button data-section="cardapio">Cardápio</button>
        <button data-section="relatorio">Relatório</button>
        <button data-section="config">Configurações</button>
      </nav>
    </aside>

    <main class="admin-main">
      <div class="admin-topbar">
        <h2 id="sectionTitle">Pedidos e mesas</h2>
        <div class="topbar-right">
          <button class="waiter-calls-btn" id="waiterCallsBtn" style="display:none;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span id="waiterCallsCount">0</span>
          </button>
          <div class="topbar-avatar"></div>
          <button class="logout-link" id="logoutBtn">Sair</button>
        </div>
      </div>

      <div id="waiterCallsPanel" class="waiter-calls-panel" style="display:none;"></div>

      <div class="admin-content">
        <section class="admin-section active" id="section-mesas">
          <div class="a-controls">
            <input type="text" class="a-search" id="tableSearch" placeholder="Número da mesa" />
            <button class="a-pill active" data-filter="todas">Todas</button>
            <button class="a-pill" data-filter="livre">Disponíveis</button>
            <button class="a-pill" data-filter="reservado">Reservadas</button>
            <button class="a-pill" data-filter="ocupado">Ocupadas</button>
          </div>
          <div class="tables-grid" id="tablesGrid"></div>
        </section>

        <section class="admin-section" id="section-cardapio">
          <div class="a-tabs">
            <button class="a-tab active" data-tab="itens">Itens</button>
            <button class="a-tab" data-tab="extras">Extras</button>
            <button class="a-tab" data-tab="midia">Mídia</button>
          </div>

          <div id="cardapioItens">
            <div class="a-controls">
              <button class="a-btn" style="width:auto;" id="newProductBtn">+ Novo item</button>
            </div>
            <div class="menu-grid" id="menuGrid"></div>
          </div>

          <div id="cardapioExtras" style="display:none;">
            <div class="a-controls">
              <button class="a-btn" style="width:auto;" id="newExtraBtn">+ Novo extra</button>
            </div>
            <p class="extras-hint">Extras aparecem no modal "Adicionar extras" que o cliente vê ao personalizar um prato.</p>
            <div class="extras-list" id="extrasList"></div>
          </div>

          <div id="cardapioMidia" style="display:none;">
            <div class="media-grid" id="mediaPhotos"></div>
            <div class="media-videos" id="mediaVideos"></div>
          </div>
        </section>

        <section class="admin-section" id="section-relatorio">
          <div class="a-tabs">
            <button class="a-tab active" data-rtab="visao">Visão geral</button>
            <button class="a-tab" data-rtab="avaliacoes">Avaliações</button>
          </div>

          <div id="relatorioVisao">
            <div class="a-controls">
              <button class="a-pill active" data-periodo="30d">Últimos 30 dias</button>
              <button class="a-pill" data-periodo="7d">Últimos 7 dias</button>
              <button class="a-pill" data-periodo="hoje">Hoje</button>
              <button class="a-pill" data-periodo="tudo">Tudo</button>
            </div>

            <div class="stat-cards" id="statCards"></div>

            <div class="report-grid-2">
              <div class="chart-card">
                <h3>Faturamento por dia</h3>
                <div id="revenueChart" class="bar-chart"></div>
              </div>
              <div class="chart-card">
                <h3>Faturamento por categoria</h3>
                <div id="categoryChart" class="category-chart"></div>
              </div>
            </div>

            <div class="report-grid-2">
              <div class="chart-card">
                <h3>Produtos mais vendidos</h3>
                <div id="topProductsList" class="top-products-list"></div>
              </div>
              <div class="chart-card">
                <h3>Formas de pagamento</h3>
                <div id="paymentBreakdown" class="payment-breakdown"></div>
              </div>
            </div>
          </div>

          <div id="relatorioAvaliacoes" style="display:none;">
            <div class="report-layout">
              <div>
                <div class="a-controls">
                  <input type="text" class="a-search" id="reportSearch" placeholder="Busca" />
                </div>
                <div class="reports-grid" id="reportsGrid"></div>
              </div>
              <div class="calendar-card">
                <div class="calendar-head">
                  <button id="calPrev">‹</button>
                  <span id="calLabel">Mês</span>
                  <button id="calNext">›</button>
                </div>
                <div class="calendar-grid" id="calendarGrid"></div>
              </div>
            </div>
          </div>
        </section>

        <section class="admin-section" id="section-config">
          <div class="settings-card">
            <div class="a-field">
              <label for="cfgNome">Nome do restaurante</label>
              <input type="text" id="cfgNome" />
            </div>
            <div class="a-field">
              <label for="cfgSubtitulo">Subtítulo / selo (ex: Sabor em Mesa)</label>
              <input type="text" id="cfgSubtitulo" />
            </div>
            <div class="a-field">
              <label for="cfgEmail">Email de contato</label>
              <input type="email" id="cfgEmail" />
            </div>
            <div class="a-field">
              <label for="cfgHorario">Horário de funcionamento</label>
              <input type="text" id="cfgHorario" />
            </div>
            <div class="a-field">
              <label for="cfgTaxa">Taxa de serviço (%)</label>
              <input type="number" id="cfgTaxa" min="0" max="100" step="0.5" />
            </div>
            <div class="settings-actions">
              <button class="a-btn" id="saveConfigBtn" style="width:auto;">Salvar alterações</button>
              <button class="a-btn a-btn-outline" id="logoutBtn2" style="width:auto;">Sair</button>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <div class="overlay" id="orderOverlay"></div>
  <div class="order-panel" id="orderPanel">
    <div class="order-panel-head">
      <h3 id="orderPanelTitle">Pedido</h3>
      <button class="order-panel-close" id="orderPanelClose">✕</button>
    </div>
    <div class="order-panel-body" id="orderPanelBody"></div>
  </div>

  <div class="modal-overlay" id="productFormOverlay"></div>
  <div class="modal-overlay" id="extraFormOverlay"></div>

  <script src="js/store.js"></script>
  <script src="js/data.js"></script>
  <script src="js/admin-data.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
